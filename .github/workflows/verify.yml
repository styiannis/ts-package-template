name: Verify

on:
  workflow_dispatch:

# One run per branch, scoped to this workflow -- groups are repo-wide, so an
# unprefixed one lets a second workflow cancel these runs. head_ref is empty
# outside pull_request, so this falls back to ref for workflow_dispatch.
concurrency:
  group: verify-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js 22.12.0
        uses: actions/setup-node@v7
        with:
          node-version: '22.12.0'

      - name: Install dependencies
        run: npm install

      - name: Verify (type checks, linting, build, dist checks)
        run: npm run verify

      - name: Test script with coverage reporting
        run: npm run test-coverage

      # These two steps swap the runtime only -- the dist/ built above stays
      # put, which is the point: one build, loaded on both ends of the range.
      - name: Set up Node.js 18.12.0 (engines floor)
        uses: actions/setup-node@v7
        with:
          node-version: '18.12.0'

      - name: Check dist loads (Node 18.12.0)
        run: npm run check-dist-loads

      - name: Set up Node.js 24 (recent major)
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Check dist loads (Node 24)
        run: npm run check-dist-loads
