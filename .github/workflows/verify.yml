name: Verify

on:
  workflow_dispatch:

# One run per branch. head_ref is empty outside pull_request, so this falls
# back to ref (workflow_dispatch); it matters once pull_request is added,
# where ref is the merge ref and would group all PRs together otherwise.
concurrency:
  group: ${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js 22 (build & test)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Verify (type checks, linting, build, exports validation)
        # Builds all three formats by default. If you pinned BUILD_FORMATS
        # for the package, set it here too (see README) or CI drifts from it.
        run: npm run verify

      - name: Test script with coverage reporting
        run: npm run test-coverage

      - name: Set up Node.js 18 (engines floor)
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Load built output (Node 18)
        run: node ./.github/scripts/load-built-output.js

      - name: Set up Node.js 24 (engines ceiling)
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Load built output (Node 24)
        run: node ./.github/scripts/load-built-output.js
